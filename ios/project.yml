# Xcode-Projekt erzeugen:  brew install xcodegen && xcodegen
name: NotfallKollegium
options:
  bundleIdPrefix: de.schule
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # ▼ Anpassen: eigene, eindeutige Bundle-ID und Apple-Team-ID
    APP_BUNDLE_ID: de.schule.notfall
    DEVELOPMENT_TEAM: ""
    # ▼ Optional: Server-Adresse fest einbauen, z. B. https://notfall.meine-schule.de
    NOTFALL_SERVER_URL: ""
targets:
  NotfallKollegium:
    type: application
    platform: iOS
    sources:
      - path: NotfallKollegium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: NotfallKollegium
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/NotfallKollegium.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Notfall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NotfallServerURL: $(NOTFALL_SERVER_URL)
