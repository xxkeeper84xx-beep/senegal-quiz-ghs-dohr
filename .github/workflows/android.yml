name: Android-App bauen

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server-Adresse fest in die App einbauen (optional), z. B. https://notfall.meine-schule.de"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      # Optional: feste Signatur, damit Updates ohne Neuinstallation möglich sind.
      # Dafür im Repo unter Settings → Secrets die Werte NOTFALL_KEYSTORE_BASE64,
      # NOTFALL_KEYSTORE_PASSWORD, NOTFALL_KEY_ALIAS und NOTFALL_KEY_PASSWORD hinterlegen.
      - name: Signaturschlüssel bereitstellen
        env:
          KS: ${{ secrets.NOTFALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/notfall.jks"
            echo "NOTFALL_KEYSTORE=$RUNNER_TEMP/notfall.jks" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        env:
          NOTFALL_KEYSTORE_PASSWORD: ${{ secrets.NOTFALL_KEYSTORE_PASSWORD }}
          NOTFALL_KEY_ALIAS: ${{ secrets.NOTFALL_KEY_ALIAS }}
          NOTFALL_KEY_PASSWORD: ${{ secrets.NOTFALL_KEY_PASSWORD }}
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: ./gradlew assembleRelease lintRelease --no-daemon -PserverUrl="$SERVER_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: notfall-kollegium-apk
          path: android/app/build/outputs/apk/release/*.apk
