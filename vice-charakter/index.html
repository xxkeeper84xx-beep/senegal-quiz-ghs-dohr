<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vice Charakter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Inter:wght@500;600&display=swap">
  <style>
    :root { --bg:#090414; --pink:#FF2A85; --orange:#FF7B00; --cyan:#00F0FF; --fg:#F5EEFF; }
    html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font-family:'Inter',system-ui,sans-serif; }
    #scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
    #scene:active { cursor:grabbing; }
    .hud { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
      padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600; letter-spacing:.04em;
      background:rgba(22,11,40,.6); border:1px solid rgba(255,42,133,.3); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      pointer-events:none; white-space:nowrap; }
    #loader { position:fixed; inset:0; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center;
      background:radial-gradient(90% 60% at 50% 110%,rgba(255,123,0,.35),transparent 60%),var(--bg); transition:opacity .5s; z-index:2; }
    #loader b { font:italic 900 clamp(24px,5vw,40px) 'Montserrat',sans-serif; text-transform:uppercase; letter-spacing:.04em;
      background:linear-gradient(90deg,var(--pink),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    #bar { width:min(280px,70vw); height:4px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden; }
    #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--pink),var(--orange)); box-shadow:0 0 12px var(--pink); transition:width .2s; }
    #note { position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); max-width:calc(100vw - 32px);
      padding:8px 14px; border-radius:12px; font-size:13px; background:rgba(22,11,40,.75); border:1px solid rgba(0,240,255,.4); z-index:1; }
    [hidden] { display:none !important; }
  </style>
  <!-- Three.js als ES-Module direkt vom CDN, feste Version -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D-Charakter im Sonnenuntergang, mit Ziehen drehbar"></canvas>
  <div id="loader"><b>Vice Charakter</b><div id="bar"><i></i></div></div>
  <div id="note" hidden></div>
  <div class="hud">Ziehen zum Drehen · Zwei Finger / Mausrad zum Zoomen</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
